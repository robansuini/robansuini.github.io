name: Site checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  external-link-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run site verification (link safety + regression tests)
        run: npm run verify
